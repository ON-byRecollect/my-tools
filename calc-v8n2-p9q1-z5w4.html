<!DOCTYPE html>

<head>

    <title>利益計算 & 相場検索</title>
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-app.js";
        import { getFirestore, doc, setDoc, collection, getDocs, onSnapshot } from "https://www.gstatic.com/firebasejs/10.9.0/firebase-firestore.js";

        // Step 3 で取得した構成オブジェクト
        const firebaseConfig = {
            apiKey: "AIzaSyBDSZD2qVw0IywRlWNq8n8WUSm0Fcyh-to",
            authDomain: "market-db-app.firebaseapp.com",
            projectId: "market-db-app",
            storageBucket: "market-db-app.firebasestorage.app",
            messagingSenderId: "348625494376",
            appId: "1:348625494376:web:e224c2847263ca186bf6dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 新規データの保存用関数
        window.saveToFirestore = async function(dbKey, data) {
            try {
                await setDoc(doc(db, "marketData", dbKey), data);
                return true;
            } catch (e) {
                console.error("Firestore Error adding document: ", e);
                return false;
            }
        };

        // 手動で最新データをクラウドから読み込む関数（更新ボタン用）
        window.refreshFromFirestore = async function() {
            const refreshBtn = document.getElementById('refresh-btn');
            const originalText = refreshBtn.innerText;
            refreshBtn.innerText = "更新中...";
            refreshBtn.disabled = true;

            try {
                const querySnapshot = await getDocs(collection(db, "marketData"));
                window.marketDB = {}; // 一旦クリアして最新に入れ直す
                
                querySnapshot.forEach((doc) => {
                    window.marketDB[doc.id] = doc.data();
                    
                    const product = doc.data().product;
                    if(product) {
                        const select = document.getElementById('market-product');
                        const exists = Array.from(select.options).some(opt => opt.value === product);
                        if (!exists && product !== "0" && product !== "") {
                            const opt = document.createElement('option');
                            opt.value = product;
                            opt.innerText = product;
                            select.appendChild(opt);
                        }
                    }
                });
                
                // 画面の数字を再計算
                window.calculateMarket();
                
            } catch (error) {
                console.error("データ更新エラー: ", error);
                alert("データの更新に失敗しました。通信環境を確認してください。");
            } finally {
                setTimeout(() => {
                    refreshBtn.innerText = originalText;
                    refreshBtn.disabled = false;
                }, 500); // 少しだけ待ってからボタンを戻す
            }
        };

        // リアルタイムリスナー：Firebase側でデータが変わったら自動で画面を更新
        window.initFirestoreListener = function() {
            onSnapshot(collection(db, "marketData"), (snapshot) => {
                snapshot.docChanges().forEach((change) => {
                    if (change.type === "added" || change.type === "modified") {
                        window.marketDB[change.doc.id] = change.doc.data();
                        
                        const product = change.doc.data().product;
                        if(product) {
                            const select = document.getElementById('market-product');
                            const exists = Array.from(select.options).some(opt => opt.value === product);
                            if (!exists && product !== "0" && product !== "") {
                                const opt = document.createElement('option');
                                opt.value = product;
                                opt.innerText = product;
                                select.appendChild(opt);
                            }
                        }
                        
                        const currentProduct = document.getElementById('market-product').value;
                        const currentModel = document.getElementById('market-model').value;
                        const currentCondition = document.getElementById('market-condition').value;
                        const currentKey = `${currentProduct}_${currentModel}_${currentCondition}`;
                        
                        if(currentKey === change.doc.id) {
                            window.calculateMarket();
                        }
                    }
                });
            });
        };
        
        window.initFirestoreListener();
    </script>

            </div>

        <div class="db-grid">
            <div class="input-group"><input type="number" id="db-price1" inputmode="numeric" placeholder="実績1"></div>
            <div class="input-group"><input type="number" id="db-price2" inputmode="numeric" placeholder="実績2"></div>
            <div class="input-group"><input type="number" id="db-price3" inputmode="numeric" placeholder="実績3"></div>
            <div class="input-group"><input type="number" id="db-price4" inputmode="numeric" placeholder="実績4"></div>
            <div class="input-group"><input type="number" id="db-price5" inputmode="numeric" placeholder="実績5"></div>
            <div class="input-group"><input type="number" id="db-price6" inputmode="numeric" placeholder="実績6"></div>
            <div class="input-group"><input type="number" id="db-price7" inputmode="numeric" placeholder="実績7"></div>
            <div class="input-group"><input type="number" id="db-price8" inputmode="numeric" placeholder="実績8"></div>
            <div class="input-group"><input type="number" id="db-price9" inputmode="numeric" placeholder="実績9"></div>
            <div class="input-group"><input type="number" id="db-price10" inputmode="numeric" placeholder="実績10"></div>
        </div>

        <button class="save-btn" onclick="saveToDb()" id="save-btn">登録</button>
        <div class="row-flex" style="margin-top: 5px; margin-bottom: 0;">
            <button class="cancel-btn" onclick="resetDbModal()">リセット</button>
            <button class="cancel-btn" onclick="closeDbModal()">キャンセル</button>
        </div>
    </div>
</div>

<script>
    // ブラウザに残っている過去のローカルデータを完全に削除
    localStorage.removeItem('marketDB');

    // 今後はFirebaseから取得したデータのみをこの変数に格納して動かします
    window.marketDB = {};

    function generateDbKey(product, model, condition) {
        return `${product}_${model}_${condition}`;
    }

    function switchMode(mode) {
        document.getElementById('tab-calc').classList.remove('active');
        document.getElementById('tab-market').classList.remove('active');
        document.getElementById('mode-calc').style.display = 'none';
        document.getElementById('mode-market').style.display = 'none';

        if (mode === 'calc') {
            document.getElementById('tab-calc').classList.add('active');
            document.getElementById('mode-calc').style.display = 'block';
            document.documentElement.style.setProperty('--current-accent', 'var(--line-green)');
        } else {
            document.getElementById('tab-market').classList.add('active');
            document.getElementById('mode-market').style.display = 'block';
            document.documentElement.style.setProperty('--current-accent', 'var(--line-red)');
            calculateMarket();
        }
    }

    function calculateCalc() {
        const costPrice = parseFloat(document.getElementById('calc-cost-price').value) || 0;
        const shippingCost = parseFloat(document.getElementById('calc-shipping-method').value) || 0;
        const minSalePrice = parseFloat(document.getElementById('calc-sale-price').value) || 0;
        
        let startingPrice = 0;
        let fleaMarket5PercentOff = 0;

        if (minSalePrice > 0) {
            const roundingUnit = minSalePrice >= 1000 ? 100 : 10;
            const baseCalc = (minSalePrice - roundingUnit) / 0.93;
            startingPrice = Math.floor(baseCalc / 10) * 10 + 10;

            const discounted5 = startingPrice * 0.95;
            if (roundingUnit === 100) {
                fleaMarket5PercentOff = Math.ceil(discounted5 / 100) * 100;
            } else {
                fleaMarket5PercentOff = Math.ceil(discounted5 / 10) * 10;
            }
        }

        document.getElementById('calc-sale-7-display').innerText = startingPrice > 0 ? startingPrice.toLocaleString() : "-";
        document.getElementById('calc-sale-5-display').innerText = fleaMarket5PercentOff > 0 ? fleaMarket5PercentOff.toLocaleString() : "-";

        function getMetrics(price) {
            if (price === 0) return { profit: 0, margin: 0 };
            const fee = Math.floor(price * 0.05);
            const profit = price - costPrice - fee - shippingCost;
            const margin = Math.floor((profit / price) * 100);
            return { profit, margin };
        }

        const metricsMin = getMetrics(minSalePrice);
        const metrics5 = getMetrics(fleaMarket5PercentOff);
        const metrics7 = getMetrics(startingPrice);

        document.getElementById('calc-profit-min').innerText = metricsMin.profit.toLocaleString() + " 円";
        document.getElementById('calc-profit-5').innerText = metrics5.profit.toLocaleString() + " 円";
        document.getElementById('calc-profit-7').innerText = metrics7.profit.toLocaleString() + " 円";
        document.getElementById('calc-margin-min').innerText = metricsMin.margin + " ％";
        document.getElementById('calc-margin-5').innerText = metrics5.margin + " ％";
        document.getElementById('calc-margin-7').innerText = metrics7.margin + " ％";
    }

    function resetCalc() {
        document.getElementById('calc-memo').value = '';
        document.getElementById('calc-cost-price').value = '';
        document.getElementById('calc-shipping-method').selectedIndex = 0;
        document.getElementById('calc-sale-price').value = '';
        calculateCalc();
    }

    function loadSavedShipping() {
        const product = document.getElementById('market-product').value;
        const model = document.getElementById('market-model').value;
        const condition = document.getElementById('market-condition').value;

        if (product === "0" || condition === "0") return;

        const dbKey = generateDbKey(product, model, condition);
        const marketData = window.marketDB[dbKey];

        if (marketData && marketData.shipping) {
            document.getElementById('market-shipping-method').value = marketData.shipping;
        }
    }

    window.calculateMarket = function() {
        const product = document.getElementById('market-product').value;
        const model = document.getElementById('market-model').value;
        const condition = document.getElementById('market-condition').value;
        const shippingSelect = document.getElementById('market-shipping-method');
        const shippingCost = parseFloat(shippingSelect.value);
        
        document.getElementById('market-target-cost').innerText = "-";
        document.getElementById('market-sale-min').innerText = "-";
        document.getElementById('market-sale-avg').innerText = "-";
        document.getElementById('market-sale-max').innerText = "-";
        document.getElementById('market-profit-min').innerText = "-";
        document.getElementById('market-profit-avg').innerText = "-";
        document.getElementById('market-profit-max').innerText = "-";
        document.getElementById('market-margin-min').innerText = "-";
        document.getElementById('market-margin-avg').innerText = "-";
        document.getElementById('market-margin-max').innerText = "-";

        if (product === "0" || condition === "0") return;

        const dbKey = generateDbKey(product, model, condition);
        const marketData = window.marketDB[dbKey];

        let prices = [];
        if (marketData) {
            if (marketData.prices && marketData.prices.length > 0) {
                prices = marketData.prices;
            } else if (marketData.min && marketData.max) {
                prices = marketData.min === marketData.max ? [marketData.min] : [marketData.min, marketData.max];
            }
        }

        if (prices.length === 0) {
            document.getElementById('market-target-cost').innerText = "データ未登録";
            document.getElementById('market-target-cost').style.color = "var(--text-gray)";
            return;
        }

        const minSalePrice = Math.min(...prices);
        const maxSalePrice = Math.max(...prices);
        const avgSalePrice = Math.floor(prices.reduce((a, b) => a + b, 0) / prices.length);

        document.getElementById('market-sale-min').innerText = minSalePrice.toLocaleString() + " 円";
        document.getElementById('market-sale-avg').innerText = avgSalePrice.toLocaleString() + " 円";
        document.getElementById('market-sale-max').innerText = maxSalePrice.toLocaleString() + " 円";

        const targetProfit = condition === "中古" ? 2000 : 1000;

        if (!isNaN(shippingCost) && shippingCost > 0) {
            const fee = Math.floor(minSalePrice * 0.05);
            const targetCost = Math.floor(minSalePrice - fee - shippingCost - targetProfit);
            
            document.getElementById('market-target-cost').innerText = targetCost.toLocaleString() + " 円";
            document.getElementById('market-target-cost').style.color = "var(--line-red)";

            function getMetrics(salePrice) {
                const f = Math.floor(salePrice * 0.05);
                const p = salePrice - targetCost - f - shippingCost;
                const m = Math.floor((p / salePrice) * 100);
                return { profit: p, margin: m };
            }

            const resMin = getMetrics(minSalePrice);
            const resAvg = getMetrics(avgSalePrice);
            const resMax = getMetrics(maxSalePrice);

            document.getElementById('market-profit-min').innerText = resMin.profit.toLocaleString() + " 円";
            document.getElementById('market-margin-min').innerText = resMin.margin + " ％";
            
            document.getElementById('market-profit-avg').innerText = resAvg.profit.toLocaleString() + " 円";
            document.getElementById('market-margin-avg').innerText = resAvg.margin + " ％";
            
            document.getElementById('market-profit-max').innerText = resMax.profit.toLocaleString() + " 円";
            document.getElementById('market-margin-max').innerText = resMax.margin + " ％";
        } else {
            document.getElementById('market-target-cost').innerText = "配送方法を選択";
            document.getElementById('market-target-cost').style.color = "var(--text-gray)";
        }
    }

    function resetMarket() {
        document.getElementById('market-product').selectedIndex = 0;
        document.getElementById('market-model').selectedIndex = 0;
        document.getElementById('market-condition').selectedIndex = 0;
        document.getElementById('market-shipping-method').selectedIndex = 0;
        calculateMarket();
    }

    function toggleManualProduct() {
        if (document.getElementById('db-product').value === 'manual') {
            document.getElementById('db-product-manual').style.display = 'block';
        } else {
            document.getElementById('db-product-manual').style.display = 'none';
        }
    }

    function openDbModal() {
        document.getElementById('db-product').innerHTML = document.getElementById('market-product').innerHTML;
        
        const manualOpt = document.createElement('option');
        manualOpt.value = "manual";
        manualOpt.innerText = "＋ 手動で新規追加";
        document.getElementById('db-product').appendChild(manualOpt);
        
        document.getElementById('db-model').innerHTML = document.getElementById('market-model').innerHTML;
        document.getElementById('db-shipping').innerHTML = document.getElementById('market-shipping-method').innerHTML;
        
        document.getElementById('db-product').value = document.getElementById('market-product').value;
        
        document.getElementById('db-product-manual').style.display = 'none';
        document.getElementById('db-product-manual').value = '';
        
        document.getElementById('db-model').value = document.getElementById('market-model').value;
        document.getElementById('db-condition').value = document.getElementById('market-condition').value;
        document.getElementById('db-shipping').value = document.getElementById('market-shipping-method').value;

        for (let i = 1; i <= 10; i++) {
            document.getElementById('db-price' + i).value = '';
        }

        document.getElementById('db-modal').style.display = 'flex';
    }

    function closeDbModal() {
        document.getElementById('db-modal').style.display = 'none';
    }

    function resetDbModal() {
        document.getElementById('db-product').selectedIndex = 0;
        toggleManualProduct();
        document.getElementById('db-model').selectedIndex = 0;
        document.getElementById('db-condition').selectedIndex = 0;
        document.getElementById('db-shipping').selectedIndex = 0;
        for (let i = 1; i <= 10; i++) {
            document.getElementById('db-price' + i).value = '';
        }
    }

    async function saveToDb() {
        let product = document.getElementById('db-product').value;
        const model = document.getElementById('db-model').value;
        const condition = document.getElementById('db-condition').value;
        const shipping = document.getElementById('db-shipping').value;

        if (product === 'manual') {
            product = document.getElementById('db-product-manual').value.trim().replace(/_/g, ' ');
            if (!product) {
                alert("新しい製品名を入力してください。");
                return;
            }
            if (condition === "0") {
                alert("状態は必ず選択してください。");
                return;
            }
        } else if (product === "0" || condition === "0") {
            alert("製品名と状態は必ず選択してください。");
            return;
        }

        let prices = [];
        for (let i = 1; i <= 10; i++) {
            let val = parseFloat(document.getElementById('db-price' + i).value);
            if (!isNaN(val) && val > 0) {
                prices.push(val);
            }
        }

        if (prices.length === 0) {
            alert("実績を1件以上入力してください。");
            return;
        }

        const dbKey = generateDbKey(product, model, condition);
        const dataToSave = {
            product: product,
            prices: prices,
            shipping: shipping
        };

        const saveBtn = document.getElementById('save-btn');
        const originalBtnText = saveBtn.innerText;
        saveBtn.innerText = "保存中...";
        saveBtn.disabled = true;

        if (typeof window.saveToFirestore === 'function') {
            const success = await window.saveToFirestore(dbKey, dataToSave);
            
            saveBtn.innerText = originalBtnText;
            saveBtn.disabled = false;

            if (success) {
                closeDbModal();
                document.getElementById('db-product-manual').style.display = 'none';
                document.getElementById('market-product').value = product;
                document.getElementById('market-model').value = model;
                document.getElementById('market-condition').value = condition;
                document.getElementById('market-shipping-method').value = shipping;
                
                // アラートなしでシームレスに更新
            } else {
                alert("クラウドへの保存に失敗しました。通信環境やFirebaseのルール設定を確認してください。");
            }
        } else {
            alert("Firebaseとの接続が準備できていません。少し待ってから再度お試しください。");
            saveBtn.innerText = originalBtnText;
            saveBtn.disabled = false;
        }
    }

    document.addEventListener('touchmove', function(event) {
        if (event.target.closest('.modal-content')) {
            return;
        }
        event.preventDefault();
    }, { passive: false });

</script>

</body>
</html>
