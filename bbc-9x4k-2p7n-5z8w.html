<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="BBC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LINE+Seed+JP:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" href="sd3.png" type="image/png">
<link rel="apple-touch-icon" href="sd3.png">
<title>プロスピ ペナント管理 (BBC)</title>
<style>
  :root{
    --bg:#eef0f3; --panel:#ffffff; --line:#d9dce1; --line2:#eceef1;
    --ink:#1c1c1e; --sub:#8e8e93; --accent:#0071e3;
    --red:#e0362c; --yellow:#fff2a8; --orange:#ef9a2e;
    --posC:#17a7c9; --posDH:#9aa0a6; --posDef:#f0932b;
    --sen:#e35d6a; --dai:#efa63d; --osae:#7cb342;
    --head:#e7ebf0;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    font-family:"LINE Seed JP","Hiragino Sans","Helvetica Neue",Arial,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; user-select:none;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
  /* header */
  header{
    flex:0 0 auto;display:flex;align-items:center;gap:14px;
    padding:8px 16px;background:var(--panel);border-bottom:1px solid var(--line);
  }
  header .title{font-weight:700;font-size:18px;letter-spacing:.5px;}
  header .title small{font-weight:400;color:var(--sub);font-size:12px;margin-left:6px;}
  header .spacer{flex:1;}
  .seg{display:inline-flex;background:var(--head);border-radius:10px;padding:3px;gap:2px;}
  .seg button{border:0;background:transparent;color:var(--sub);font:inherit;font-size:14px;
    padding:6px 18px;border-radius:8px;font-weight:700;cursor:pointer;}
  .seg button.on{background:var(--panel);color:var(--accent);box-shadow:0 1px 2px rgba(0,0,0,.12);}
  .hint{color:var(--sub);font-size:12px;}
  /* main 3 columns */
  main{flex:1 1 auto;display:grid;grid-template-columns:1.06fr 0.94fr 0.82fr;gap:10px;padding:10px;min-height:0;}
  .col{display:flex;flex-direction:column;gap:10px;min-height:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;
    display:flex;flex-direction:column;min-height:0;overflow:hidden;}
  .card > .chead{flex:0 0 auto;display:flex;align-items:center;gap:8px;
    padding:7px 12px;border-bottom:1px solid var(--line2);background:#fafbfc;}
  .card > .chead h2{margin:0;font-size:14px;font-weight:700;}
  .card > .chead .sub{color:var(--sub);font-size:11px;}
  .card > .chead .spacer{flex:1;}
  .cbody{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:4px 8px 8px;}
  .cbody.tight{padding:2px 6px 6px;}
  .subttl{font-size:11px;color:var(--sub);font-weight:700;margin:8px 4px 3px;display:flex;align-items:center;gap:6px;}
  .subttl .ln{flex:1;height:1px;background:var(--line2);}
  .redsep{height:3px;background:var(--red);border-radius:2px;margin:8px 2px 4px;}
  /* rows */
  .row{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:9px;cursor:pointer;min-height:34px;}
  .row:active{background:#f0f4fa;}
  .ord{flex:0 0 22px;text-align:center;font-weight:700;font-size:13px;color:#444;}
  .rot{flex:0 0 34px;text-align:center;font-weight:700;font-size:12px;color:#444;}
  .role{flex:0 0 52px;font-size:11px;color:var(--sub);text-align:center;font-weight:700;}
  .pos{flex:0 0 30px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:700;color:#fff;background:var(--posDef);}
  .pos.c{background:var(--posC);} .pos.dh{background:var(--posDH);} .pos.none{background:transparent;color:var(--sub);border:1px dashed var(--line);}
  .badge{flex:0 0 auto;height:22px;padding:0 8px;border-radius:6px;display:inline-flex;align-items:center;
    font-size:11px;font-weight:700;color:#fff;background:var(--posDef);white-space:nowrap;}
  .badge.sen{background:var(--sen);} .badge.dai{background:var(--dai);} .badge.osae{background:var(--osae);}
  .nm{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:6px;overflow:hidden;
    padding:3px 8px;border-radius:7px;}
  .nm .pn{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .nm.left .pn{color:var(--red);} .nm.right .pn{color:var(--ink);}
  .nm.empty{background:var(--yellow);}
  .tags{display:flex;gap:4px;flex:0 0 auto;margin-left:auto;padding-left:6px;}
  .tag{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;white-space:nowrap;}
  .tag.k{background:#fdecd2;color:#c9781a;} /* 覚醒 */
  .tag.l{background:#fde3d0;color:#c0561f;} /* 限界突破 */
  .tag.g{background:#e9eef5;color:#4a5b74;} /* 成長 */
  .addrow{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--accent);
    font-size:12px;font-weight:700;padding:6px;border:1px dashed var(--line);border-radius:9px;margin:6px 4px 2px;cursor:pointer;}
  /* save list */
  .save-row{display:grid;grid-template-columns:44px 78px 1fr;align-items:center;gap:6px;
    padding:6px 8px;border-radius:9px;cursor:pointer;border-bottom:1px solid var(--line2);}
  .save-row:active{background:#f0f4fa;}
  .save-row .no{font-weight:700;font-size:14px;text-align:center;color:#333;}
  .save-row .memo{font-size:11px;color:var(--sub);font-weight:700;}
  .save-row .kp{font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .save-head{display:grid;grid-template-columns:44px 78px 1fr;gap:6px;padding:2px 8px;font-size:10px;color:var(--sub);font-weight:700;}
  /* cycle */
  .cycle{width:100%;border-collapse:separate;border-spacing:0 4px;}
  .cycle th{font-size:11px;color:var(--sub);font-weight:700;padding:2px 0;}
  .cycle td{text-align:center;}
  .cyc-ord{font-weight:700;font-size:13px;color:#444;width:34px;}
  .cyc-cell{width:23%;}
  .cyc-btn{width:38px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fbfcfd;
    display:inline-flex;align-items:center;justify-content:center;font-size:17px;color:var(--sub);cursor:pointer;}
  .cyc-btn.on{background:#fff6d6;border-color:var(--orange);color:#d98a00;font-weight:700;}
  .cyc-row.done .cyc-ord{color:var(--osae);}
  .cyc-row.done .cyc-btn.on{background:#e6f4d8;border-color:var(--osae);color:#5a8a2a;}
  /* modal */
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.32);display:none;align-items:center;justify-content:center;z-index:50;}
  .overlay.show{display:flex;}
  .modal{background:var(--panel);border-radius:18px;width:440px;max-width:92vw;max-height:88vh;overflow:auto;
    padding:18px 20px 20px;box-shadow:0 20px 60px rgba(0,0,0,.3);}
  .modal h3{margin:0 0 14px;font-size:17px;}
  .fld{margin-bottom:13px;}
  .fld label{display:block;font-size:12px;color:var(--sub);font-weight:700;margin-bottom:5px;}
  .fld input[type=text], .fld input[type=number], .fld select{
    width:100%;font:inherit;font-size:16px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:#fafbfc;color:var(--ink);}
  .fld input:focus, .fld select:focus{outline:2px solid var(--accent);border-color:transparent;background:#fff;}
  .togs{display:flex;gap:8px;}
  .togs button{flex:1;font:inherit;font-size:15px;font-weight:700;padding:9px;border-radius:10px;border:1px solid var(--line);
    background:#fafbfc;color:var(--sub);cursor:pointer;}
  .togs button.on{background:var(--ink);color:#fff;border-color:var(--ink);}
  .togs button.on.red{background:var(--red);border-color:var(--red);}
  .mbtns{display:flex;gap:10px;margin-top:18px;}
  .mbtns button{flex:1;font:inherit;font-size:16px;font-weight:700;padding:12px;border-radius:12px;border:0;cursor:pointer;}
  .mbtns .ok{background:var(--accent);color:#fff;}
  .mbtns .cancel{background:var(--head);color:var(--ink);}
  .mbtns .del{background:#fff;color:var(--red);border:1px solid var(--line);flex:0 0 92px;}
  ::-webkit-scrollbar{width:7px;height:7px;} ::-webkit-scrollbar-thumb{background:#c7ccd4;border-radius:4px;}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="title">プロスピ ペナント管理<small>BBC</small></div>
    <div class="seg" id="patternSeg">
      <button data-p="A" class="on">打順 A</button>
      <button data-p="B">打順 B</button>
    </div>
    <div class="spacer"></div>
    <div class="hint">項目をタップで編集・端末内に自動保存</div>
  </header>
  <main>
    <!-- 野手 -->
    <div class="col">
      <div class="card" style="flex:1 1 auto;">
        <div class="chead"><h2>野手</h2><span class="sub" id="lineupSub">スタメン（打順A）</span></div>
        <div class="cbody tight" id="battersBody"></div>
      </div>
    </div>
    <!-- 投手 -->
    <div class="col">
      <div class="card" style="flex:1 1 auto;">
        <div class="chead"><h2>投手</h2><span class="sub">先発・第二・抑え・2軍</span></div>
        <div class="cbody tight" id="pitchersBody"></div>
      </div>
    </div>
    <!-- 右：セーブ + サイクル -->
    <div class="col">
      <div class="card" style="flex:1 1 55%;">
        <div class="chead"><h2>セーブデータ</h2><span class="sub">No.1〜50</span><span class="spacer"></span></div>
        <div class="save-head"><div>No</div><div>メモ</div><div>キーポイント</div></div>
        <div class="cbody tight" id="saveBody"></div>
      </div>
      <div class="card" style="flex:1 1 45%;">
        <div class="chead"><h2>サイクル安打チェック</h2><span class="spacer"></span>
          <span class="badge" style="background:var(--head);color:var(--sub);cursor:pointer" id="cycleReset">リセット</span></div>
        <div class="cbody" id="cycleBody"></div>
      </div>
    </div>
  </main>
</div>

<!-- edit modal -->
<div class="overlay" id="overlay">
  <div class="modal" id="modal"></div>
</div>

<script>
"use strict";
const LS_KEY = "bbc_pennant_v1";
const POS_BAT = ["捕","一","二","三","遊","左","中","右","指"];
const AWAKEN = ["", "能力覚醒","移籍覚醒"];
const GROWTH = ["", "早熟","普通","晩成","超晩成","持続"];
const PIT_ROLE = ["先発","第二","抑え"];

function b(position,name,bat,awaken,limit,growth){return {position,name,bat:bat||"右",awaken:awaken||"",limit:!!limit,growth:growth||""};}
function p(name,thr,awaken,limit,growth){return {name,thr:thr||"右",awaken:awaken||"",limit:!!limit,growth:growth||""};}

function defaults(){
  return {
    pattern:"A",
    batters:{
      A:[ b("左","楠田彗大","右","能力覚醒",true,""), b("一","イーガン","右","",false,"超晩成"),
          b("遊","大松佑斗","右","",true,""), b("右","片平悠翔","左","",true,"超晩成"),
          b("二","曽根凌太朗","左","能力覚醒",false,""), b("中","新垣裕也","左","移籍覚醒",false,""),
          b("捕","","右","",false,""), b("三","美濃口佑弥","右","",false,""),
          b("指","","右","",false,"") ],
      B:[ b("一","長坂琉希","右","",false,""), b("二","","右","",false,""),
          b("左","鵜飼健吾","左","",false,""), b("右","関水俊平","右","",false,"超晩成"),
          b("中","黒田颯汰","右","",false,"超晩成"), b("三","ヘンマン","右","",false,"超晩成"),
          b("捕","桑名将吾","左","",false,"超晩成"), b("遊","関屋瑛汰","右","",false,"超晩成"),
          b("指","","右","",false,"") ]
    },
    bench:[ {role:"守備要員", ...b("捕","野田和樹","右","",false,"超晩成")},
            {role:"守備要員", ...b("","","右","",false,"")},
            {role:"代打要員", ...b("","","右","",false,"")},
            {role:"代走要員", ...b("","","右","",false,"")} ],
    farmB:[ b("左","篠原和磨","左","能力覚醒",false,""), b("三","コステロ","左","",false,""),
            b("捕","倉橋樹生","右","",false,"") ],
    pit:{
      starters:[ p("長峰朔久","右","能力覚醒",false,""), p("田谷尊","左","能力覚醒",true,""),
                 p("五十嵐陽","右","",true,""), p("","右","",false,""), p("高田真翔","右","能力覚醒",true,"") ],
      second:[ p("小牧陽琉","左","能力覚醒",true,""), p("","右","",false,""),
               p("デンゼル","左","能力覚醒",false,""), p("三枝楓太","右","",false,""), p("","右","",false,"") ],
      closer:[ p("小林啓斗","右","能力覚醒",true,"") ],
      farm:[ {role:"先発", ...p("福留昊汰","左","",false,"")}, {role:"第二", ...p("高見拓海","左","",false,"")},
             {role:"先発", ...p("金剛直生","右","",false,"")}, {role:"先発", ...p("高松玲央","右","",false,"")},
             {role:"第二", ...p("中山壮","右","",false,"")}, {role:"第二", ...p("寺本幸生","右","",false,"")},
             {role:"第二", ...p("折笠怜央","右","",false,"")}, {role:"第二", ...p("田部啓介","右","",false,"")} ]
    },
    save:[ {no:50,memo:"8年目開始",kp:"大松突破（プレイ後）"}, {no:38,memo:"",kp:"大松突破／覚醒（オフ）"},
           {no:39,memo:"",kp:"ドラフト前"}, {no:40,memo:"",kp:"生田入団"},
           {no:43,memo:"9年目開始",kp:"自由契約交渉"}, {no:44,memo:"9年目開始",kp:"自由契約交渉"} ],
    cycle: Array.from({length:9},()=>[false,false,false,false])
  };
}

let S = load();
function load(){
  try{ const raw=localStorage.getItem(LS_KEY); if(raw){ return migrate(JSON.parse(raw)); } }catch(e){}
  return defaults();
}
function migrate(s){ const d=defaults(); return Object.assign({},d,s,{cycle:s.cycle&&s.cycle.length===9?s.cycle:d.cycle}); }
function save(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(S)); }catch(e){} }

/* ---------- render helpers ---------- */
function posClass(pos){ if(pos==="捕")return"c"; if(pos==="指")return"dh"; if(!pos)return"none"; return""; }
function tagsHTML(o){
  let h="";
  if(o.awaken) h+=`<span class="tag k">${o.awaken}</span>`;
  if(o.limit)  h+=`<span class="tag l">限界突破</span>`;
  if(o.growth) h+=`<span class="tag g">${o.growth}</span>`;
  return h?`<span class="tags">${h}</span>`:"";
}
function nameHTML(o, kind){
  const empty = !o.name;
  const dir = (kind==="pit" ? o.thr : o.bat)==="左" ? "left":"right";
  const label = empty ? "（空き）" : o.name;
  return `<div class="nm ${dir} ${empty?"empty":""}"><span class="pn">${escapeH(label)}</span>${tagsHTML(o)}</div>`;
}
function escapeH(s){return String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));}

/* ---------- batters column ---------- */
function renderBatters(){
  const pat = S.pattern;
  document.getElementById("lineupSub").textContent = `スタメン（打順${pat}）`;
  let h = "";
  // starters
  S.batters[pat].forEach((o,i)=>{
    h += `<div class="row" onclick="editBatter('${pat}',${i})">
      <span class="ord">${i+1}</span>
      <span class="pos ${posClass(o.position)}">${o.position||"—"}</span>
      ${nameHTML(o,"bat")}
    </div>`;
  });
  // bench
  h += `<div class="subttl">ベンチ<span class="ln"></span></div>`;
  S.bench.forEach((o,i)=>{
    h += `<div class="row" onclick="editBench(${i})">
      <span class="role">${o.role||"—"}</span>
      <span class="pos ${posClass(o.position)}">${o.position||"—"}</span>
      ${nameHTML(o,"bat")}
    </div>`;
  });
  h += `<div class="addrow" onclick="addBench()">＋ ベンチを追加</div>`;
  // farm
  h += `<div class="redsep"></div><div class="subttl" style="color:var(--red)">2軍（昇格候補）<span class="ln"></span></div>`;
  S.farmB.forEach((o,i)=>{
    h += `<div class="row" onclick="editFarmB(${i})">
      <span class="ord"></span>
      <span class="pos ${posClass(o.position)}">${o.position||"—"}</span>
      ${nameHTML(o,"bat")}
    </div>`;
  });
  h += `<div class="addrow" onclick="addFarmB()">＋ 2軍野手を追加</div>`;
  document.getElementById("battersBody").innerHTML = h;
}

/* ---------- pitchers column ---------- */
function pitRow(o, group, i, label, cls, roleText){
  return `<div class="row" onclick="editPit('${group}',${i})">
    <span class="rot">${label}</span>
    <span class="badge ${cls}">${roleText}</span>
    ${nameHTML(o,"pit")}
  </div>`;
}
function renderPitchers(){
  let h="";
  h += `<div class="subttl">先発<span class="ln"></span></div>`;
  S.pit.starters.forEach((o,i)=> h+=pitRow(o,"starters",i,i+1,"sen","先発"));
  h += `<div class="subttl">第二先発<span class="ln"></span></div>`;
  S.pit.second.forEach((o,i)=> h+=pitRow(o,"second",i,`${i+1}-${i+1}`,"dai","第二"));
  h += `<div class="subttl">抑え<span class="ln"></span></div>`;
  S.pit.closer.forEach((o,i)=> h+=pitRow(o,"closer",i,"11","osae","抑え"));
  h += `<div class="redsep"></div><div class="subttl" style="color:var(--red)">2軍（昇格候補）<span class="ln"></span></div>`;
  S.pit.farm.forEach((o,i)=>{
    const cls = o.role==="先発"?"sen":o.role==="抑え"?"osae":"dai";
    h += `<div class="row" onclick="editPit('farm',${i})">
      <span class="rot"></span>
      <span class="badge ${cls}">${o.role||"第二"}</span>
      ${nameHTML(o,"pit")}
    </div>`;
  });
  h += `<div class="addrow" onclick="addFarmP()">＋ 2軍投手を追加</div>`;
  document.getElementById("pitchersBody").innerHTML = h;
}

/* ---------- save data ---------- */
function renderSave(){
  let h="";
  S.save.forEach((o,i)=>{
    h += `<div class="save-row" onclick="editSave(${i})">
      <span class="no">${o.no||"—"}</span>
      <span class="memo">${escapeH(o.memo||"")}</span>
      <span class="kp">${escapeH(o.kp||"")}</span>
    </div>`;
  });
  h += `<div class="addrow" onclick="addSave()">＋ セーブ記録を追加</div>`;
  document.getElementById("saveBody").innerHTML = h;
}

/* ---------- cycle ---------- */
const CYC_COLS=["単打","二塁打","三塁打","本塁打"];
function renderCycle(){
  let h=`<table class="cycle"><thead><tr><th></th>`;
  CYC_COLS.forEach(c=> h+=`<th>${c}</th>`); h+=`</tr></thead><tbody>`;
  S.cycle.forEach((row,r)=>{
    const done = row.every(x=>x);
    h+=`<tr class="cyc-row ${done?"done":""}"><td class="cyc-ord">${r+1}</td>`;
    row.forEach((v,c)=>{ h+=`<td class="cyc-cell"><span class="cyc-btn ${v?"on":""}" onclick="toggleCycle(${r},${c})">${v?"◎":"○"}</span></td>`; });
    h+=`</tr>`;
  });
  h+=`</tbody></table>`;
  document.getElementById("cycleBody").innerHTML=h;
}

function renderAll(){ renderBatters(); renderPitchers(); renderSave(); renderCycle(); }

/* ---------- interactions ---------- */
window.setPattern=function(pat){ S.pattern=pat; save();
  document.querySelectorAll("#patternSeg button").forEach(x=>x.classList.toggle("on",x.dataset.p===pat));
  renderBatters();
};
document.getElementById("patternSeg").addEventListener("click",e=>{ const btn=e.target.closest("button"); if(btn) setPattern(btn.dataset.p); });

window.toggleCycle=function(r,c){ S.cycle[r][c]=!S.cycle[r][c]; save(); renderCycle(); };
document.getElementById("cycleReset").addEventListener("click",()=>{
  if(confirm("サイクル安打チェックをすべてリセットしますか？")){ S.cycle=Array.from({length:9},()=>[false,false,false,false]); save(); renderCycle(); }
});

/* add rows */
window.addBench=function(){ S.bench.push({role:"守備要員",...b("","","右","",false,"")}); save(); renderBatters(); };
window.addFarmB=function(){ S.farmB.push(b("","","右","",false,"")); save(); renderBatters(); };
window.addFarmP=function(){ S.pit.farm.push({role:"第二",...p("","右","",false,"")}); save(); renderPitchers(); };
window.addSave=function(){ S.save.push({no:"",memo:"",kp:""}); save(); renderSave(); editSave(S.save.length-1); };

/* ---------- edit modal ---------- */
let ctx=null;
const overlay=document.getElementById("overlay"), modalEl=document.getElementById("modal");
function closeModal(){ overlay.classList.remove("show"); ctx=null; }
overlay.addEventListener("click",e=>{ if(e.target===overlay) closeModal(); });

function fldText(id,label,val){return `<div class="fld"><label>${label}</label><input type="text" id="${id}" value="${escapeAttr(val||"")}"></div>`;}
function fldNum(id,label,val){return `<div class="fld"><label>${label}</label><input type="number" id="${id}" min="1" max="50" value="${val||""}"></div>`;}
function fldSelect(id,label,opts,val){
  let o=opts.map(x=>`<option value="${escapeAttr(x)}" ${x===val?"selected":""}>${x===""?"（なし）":x}</option>`).join("");
  return `<div class="fld"><label>${label}</label><select id="${id}">${o}</select></div>`;
}
function fldToggle(id,label,opts,val,redVal){
  const btns=opts.map(x=>`<button type="button" data-v="${x}" class="${x===val?"on":""} ${x===redVal?"red":""}">${x}</button>`).join("");
  return `<div class="fld"><label>${label}</label><div class="togs" id="${id}">${btns}</div></div>`;
}
function escapeAttr(s){return String(s).replace(/"/g,"&quot;").replace(/</g,"&lt;");}
function bindToggle(id){
  const box=document.getElementById(id);
  box.addEventListener("click",e=>{ const btn=e.target.closest("button"); if(!btn)return;
    box.querySelectorAll("button").forEach(x=>x.classList.remove("on")); btn.classList.add("on"); });
}
function togVal(id){ const on=document.querySelector(`#${id} button.on`); return on?on.dataset.v:""; }

function openBatterModal(title,o,onSave,onDelete,extra){
  let html=`<h3>${title}</h3>`;
  if(extra==="bench") html+=fldSelect("f_role","役割",["守備要員","代打要員","代走要員"],o.role||"守備要員");
  html+=fldSelect("f_pos","守備",["",...POS_BAT],o.position||"");
  html+=fldText("f_name","選手名",o.name);
  html+=fldToggle("f_bat","打席",["右","左"],o.bat||"右","左");
  html+=fldSelect("f_awk","覚醒",AWAKEN,o.awaken||"");
  html+=fldToggle("f_lim","限界突破",["なし","あり"],o.limit?"あり":"なし","");
  html+=fldSelect("f_grw","成長タイプ",GROWTH,o.growth||"");
  html+=`<div class="mbtns">`;
  if(onDelete) html+=`<button class="del" id="m_del">削除</button>`;
  html+=`<button class="cancel" id="m_cancel">キャンセル</button><button class="ok" id="m_ok">保存</button></div>`;
  modalEl.innerHTML=html; overlay.classList.add("show");
  bindToggle("f_bat"); bindToggle("f_lim");
  document.getElementById("m_cancel").onclick=closeModal;
  document.getElementById("m_ok").onclick=()=>{
    const r={ position:document.getElementById("f_pos").value, name:document.getElementById("f_name").value.trim(),
      bat:togVal("f_bat")||"右", awaken:document.getElementById("f_awk").value, limit:togVal("f_lim")==="あり",
      growth:document.getElementById("f_grw").value };
    if(extra==="bench") r.role=document.getElementById("f_role").value;
    onSave(r); save(); renderAll(); closeModal();
  };
  if(onDelete) document.getElementById("m_del").onclick=()=>{ if(confirm("この行を削除しますか？")){ onDelete(); save(); renderAll(); closeModal(); } };
}

window.editBatter=function(pat,i){ const o=S.batters[pat][i];
  openBatterModal(`打順${pat} ${i+1}番 編集`,o,(r)=>{S.batters[pat][i]=r;},null); };
window.editBench=function(i){ const o=S.bench[i];
  openBatterModal(`ベンチ編集`,o,(r)=>{S.bench[i]=r;},()=>{S.bench.splice(i,1);},"bench"); };
window.editFarmB=function(i){ const o=S.farmB[i];
  openBatterModal(`2軍野手 編集`,o,(r)=>{S.farmB[i]=r;},()=>{S.farmB.splice(i,1);}); };

window.editPit=function(group,i){
  const o=S.pit[group][i]; const isFarm=group==="farm";
  const roleFixed = group==="starters"?"先発":group==="second"?"第二":group==="closer"?"抑え":null;
  let html=`<h3>${isFarm?"2軍投手 編集":(roleFixed+" 編集")}</h3>`;
  if(isFarm) html+=fldSelect("f_role","位置",PIT_ROLE,o.role||"第二");
  html+=fldText("f_name","選手名",o.name);
  html+=fldToggle("f_thr","投球",["右","左"],o.thr||"右","左");
  html+=fldSelect("f_awk","覚醒",AWAKEN,o.awaken||"");
  html+=fldToggle("f_lim","限界突破",["なし","あり"],o.limit?"あり":"なし","");
  html+=fldSelect("f_grw","成長タイプ",GROWTH,o.growth||"");
  html+=`<div class="mbtns">`;
  if(isFarm) html+=`<button class="del" id="m_del">削除</button>`;
  html+=`<button class="cancel" id="m_cancel">キャンセル</button><button class="ok" id="m_ok">保存</button></div>`;
  modalEl.innerHTML=html; overlay.classList.add("show");
  bindToggle("f_thr"); bindToggle("f_lim");
  document.getElementById("m_cancel").onclick=closeModal;
  document.getElementById("m_ok").onclick=()=>{
    const r={ name:document.getElementById("f_name").value.trim(), thr:togVal("f_thr")||"右",
      awaken:document.getElementById("f_awk").value, limit:togVal("f_lim")==="あり", growth:document.getElementById("f_grw").value };
    if(isFarm) r.role=document.getElementById("f_role").value;
    S.pit[group][i]=r; save(); renderAll(); closeModal();
  };
  if(isFarm) document.getElementById("m_del").onclick=()=>{ if(confirm("この行を削除しますか？")){ S.pit.farm.splice(i,1); save(); renderPitchers(); closeModal(); } };
};

window.editSave=function(i){ const o=S.save[i];
  let html=`<h3>セーブ記録 編集</h3>`;
  html+=fldNum("f_no","No（1〜50）",o.no);
  html+=fldText("f_memo","メモ",o.memo);
  html+=fldText("f_kp","キーポイント",o.kp);
  html+=`<div class="mbtns"><button class="del" id="m_del">削除</button><button class="cancel" id="m_cancel">キャンセル</button><button class="ok" id="m_ok">保存</button></div>`;
  modalEl.innerHTML=html; overlay.classList.add("show");
  document.getElementById("m_cancel").onclick=closeModal;
  document.getElementById("m_ok").onclick=()=>{
    const no=parseInt(document.getElementById("f_no").value,10);
    S.save[i]={ no:isNaN(no)?"":Math.min(50,Math.max(1,no)), memo:document.getElementById("f_memo").value.trim(), kp:document.getElementById("f_kp").value.trim() };
    save(); renderSave(); closeModal();
  };
  document.getElementById("m_del").onclick=()=>{ if(confirm("この記録を削除しますか？")){ S.save.splice(i,1); save(); renderSave(); closeModal(); } };
};

/* init */
document.querySelectorAll("#patternSeg button").forEach(x=>x.classList.toggle("on",x.dataset.p===S.pattern));
renderAll();
</script>
